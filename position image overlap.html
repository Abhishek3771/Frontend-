<!DOCTYPE html> 
 
<html> 
 
<head> 
    <title>Image Hover</title> 
</head> 
 
<style> 
    body{ 
        background-image: url(background\ image2.jpg); 
        background-repeat: no-repeat; 
        background-size: cover; 
    } 
 
    .img1 { 
        position: absolute; 
        width: 400px; 
        height: 330px; 
        margin-left: 50px; 
        margin-top: 50px; 
         border-radius: 20px;
    } 
 
    .img2 { 
        position: absolute; 
        width: 400px; 
        height: 330px; 
        margin-left: 50px; 
        margin-top: 50px; 
        opacity: 0; 
         border-radius: 20px;
    } 

    .img3{ 
        position: absolute; 
        width: 441px; 
        height: 330px; 
        margin-left: 500px; 
        margin-top: 50px; 
         border-radius: 20px;
    } 

    .img4{ 
        position: absolute; 
        width: 441px; 
        height: 330px; 
        margin-left: 500px; 
        margin-top: 50px; 
         border-radius: 20px;
        opacity: 0; 
    } 

    .img7{ 
        position: absolute; 
        width: 441px; 
        height: 330px; 
        margin-left:991px; 
        margin-top: 50px; 
         border-radius: 20px;
       
    } 

    .img6{ 
        position: absolute; 
        width: 441px; 
        height: 330px; 
        margin-left: 991px; 
        margin-top: 50px; 
        opacity: 0; 
        border-radius: 20px;
    } 
     
    img:hover { 
        opacity: 1; 
    } 
 
</style> 
 
<body> 
 
    <img class="img1" src="my photo.jpeg"> 
    <img class="img2" src="my photo2.png"> 
 
    <img class="img3" src="online image2.jpg"> 
    <img class="img4" src="online images.jpg"> 
   
    <img class="img7" src="online image3.jpg"> 
    <img class="img6" src="online image4.jpg"> 
     
</body> 
 
</html>
